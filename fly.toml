# Fly.io deployment: Mumbai (bom) region, so the API can reach data.gov.in,
# which refuses connections from servers outside India.
# Set the key once:  fly secrets set DATA_GOV_IN_API_KEY=...   (or Dashboard -> app -> Secrets)
app = "india-air-pollution-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
