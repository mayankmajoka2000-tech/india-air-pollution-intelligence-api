name: Python API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download 320,000 record dataset
        run: |
          mkdir -p data
          curl -L \
            -o data/india_air_quality_total_320000.csv \
            https://github.com/mayankmajoka2000-tech/india-air-pollution-intelligence-api/releases/download/v5.0.0-data/india_air_quality_total_320000.csv

      - name: Verify dataset
        run: |
          ls -lh data/india_air_quality_total_320000.csv
          python -c "import pandas as pd; df=pd.read_csv('data/india_air_quality_total_320000.csv'); print('Dataset records:', len(df)); print('Dataset columns:', len(df.columns)); print('Column names:'); print(df.columns.tolist())"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q

      - name: Train ML model
        run: |
          python scripts/train_models.py

      - name: Upload trained ML model
        uses: actions/upload-artifact@v4
        with:
          name: trained-pm25-model
          path: |
            data/models/best_pm25_model.joblib
            data/models/model_features.csv
            data/model_comparison.csv
