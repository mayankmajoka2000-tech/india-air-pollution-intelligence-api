services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/airpollution
    depends_on: [db]
    volumes: [".:/app"]
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: airpollution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
